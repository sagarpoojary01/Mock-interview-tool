<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PrepPilot - AI Mock Interview Coach</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>PrepPilot</h1>
    <nav id="nav" hidden>
      <span id="who"></span>
      <button id="logout" class="ghost">Log out</button>
    </nav>
  </header>

  <main>
    <section id="auth-view">
      <div class="card">
        <h2 id="auth-title">Log in</h2>
        <form id="auth-form">
          <input id="full_name" placeholder="Full name" hidden>
          <input id="email" type="email" placeholder="Email" required>
          <input id="password" type="password" placeholder="Password (min 8 chars)" minlength="8" required>
          <button type="submit">Continue</button>
        </form>
        <p class="muted"><a href="#" id="toggle-auth">Need an account? Register</a></p>
        <p id="auth-error" class="error"></p>
      </div>
    </section>

    <section id="app-view" hidden>
      <div class="card">
        <h2>Start a mock interview</h2>
        <form id="new-form" class="row">
          <input id="role" placeholder="Role, e.g. Python Developer" required>
          <select id="level">
            <option>intern</option><option selected>junior</option><option>mid</option><option>senior</option>
          </select>
          <input id="num" type="number" min="1" max="10" value="5" title="Number of questions">
          <button type="submit" id="start-btn">Start</button>
        </form>
        <p id="new-error" class="error"></p>
      </div>

      <div id="interview" class="card" hidden></div>

      <div class="card">
        <h2>Past sessions</h2>
        <ul id="history" class="history"></ul>
      </div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
